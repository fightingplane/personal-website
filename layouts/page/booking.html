{{- define "main" }}

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">
      {{ .Description }}
    </div>
    {{- end }}
  </header>

  {{- if .Content }}
  <div class="post-content">
    {{ .Content }}
  </div>
  {{- end }}

  <div class="booking-container">
    <iframe
      src="{{ .Params.calendarUrl }}"
      style="border: 0"
      width="100%"
      height="800"
      frameborder="0"
      loading="lazy"
      title="Book a meeting with {{ site.Params.author }}"
    ></iframe>
  </div>
</article>

<style>
  .booking-container {
    margin-top: 1.5rem;
    border-radius: 8px;
    overflow: hidden;
  }
  .booking-container iframe {
    min-height: 600px;
  }
  @media (max-width: 768px) {
    .booking-container iframe {
      height: 600px;
    }
  }
</style>

{{- end }}
