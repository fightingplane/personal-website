server {
    listen 80;
    listen [::]:80;
    
    server_name blog.wangxiaoyuan.top;
    
    location / {
        proxy_pass http://personal-website:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS server (will be configured with SSL later)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name blog.wangxiaoyuan.top;
    
    # SSL certificates will be added here after Let's Encrypt setup
    ssl_certificate /etc/ssl/certs/blog.wangxiaoyuan.top.crt;
    ssl_certificate_key /etc/ssl/private/blog.wangxiaoyuan.top.key;
    
    location / {
        proxy_pass http://personal-website:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}