baseURL = "https://blog.wangxiaoyuan.top/"
languageCode = "en-us"
title = "Rocky's Website"
theme = "PaperMod"

[params]
  env = "production"
  title = "Rocky's Website"
  description = "Articles, Videos, and More"
  author = "Rocky Wang"
  
  # Profile Mode configuration for homepage avatar
  [params.profileMode]
    enabled = true
    imageUrl = "/images/avatar.jpg"
    imageTitle = "Rocky Wang"
    imageWidth = 150
    imageHeight = 150
    title = "Rocky Wang"
    subtitle = "Software Engineer & Content Creator"
  
  # Header logo configuration
  [params.label]
    icon = "/images/avatar.jpg"
    iconHeight = 30
  
  # Social media links
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/fightingplane"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/wangxiaoyuan1987"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:juster.wang@gmail.com"
    
  # Features
  enableSocialShare = true
  enableComments = false
  disableHLJS = false

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Videos"
    url = "/videos/"
    weight = 20
  [[menu.main]]
    name = "Booking"
    url = "/booking/"
    weight = 25
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 30

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"